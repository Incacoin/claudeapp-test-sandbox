<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presiona y gana</title>
  <style>
    /* Estilos de la pagina: colores, tamanos y posiciones */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f4f8;
      color: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    /* El contador de dinero */
    #total {
      font-size: 3rem;
      font-weight: 700;
      margin: 16px 0 24px;
    }

    /* Fila que agrupa los botones y los deja bajar de linea en pantallas chicas */
    #botones {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    /* Estilo comun de todos los botones */
    button {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px 24px;
      cursor: pointer;
    }

    /* Se achican un poquito al presionarlos */
    button:active {
      transform: scale(0.96);
    }

    /* Cada boton con su propio color */
    #sumar { background: #2b59d8; }
    #sumar:hover { background: #1f45ad; }

    #restar { background: #d83a3a; }
    #restar:hover { background: #ad2b2b; }

    #reiniciar { background: #6b6b80; }
    #reiniciar:hover { background: #55556b; }

    #mensaje {
      margin-top: 20px;
      min-height: 24px;
      color: #55556b;
    }
  </style>
</head>
<body>

  <h1>Presiona y te ganas 100 pesos</h1>

  <!-- Aqui se muestra el total acumulado -->
  <div id="total">$0</div>

  <div id="botones">
    <button id="sumar">Ganar 100</button>
    <button id="restar">Perder 100</button>
    <button id="reiniciar">Reiniciar</button>
  </div>

  <p id="mensaje"></p>

  <script>
    // Guardamos cuanto dinero lleva ganado
    let total = 0;

    // Buscamos los elementos de la pagina para poder cambiarlos
    const botonSumar = document.getElementById('sumar');
    const botonRestar = document.getElementById('restar');
    const botonReiniciar = document.getElementById('reiniciar');
    const textoTotal = document.getElementById('total');
    const mensaje = document.getElementById('mensaje');

    // Esta funcion refresca lo que se ve en pantalla.
    // La usamos desde los tres botones para no repetir el mismo codigo.
    function actualizar(texto) {
      textoTotal.textContent = '$' + total;
      mensaje.textContent = texto;

      // El color del total cambia segun si estas arriba, abajo o en cero
      if (total > 0) {
        textoTotal.style.color = '#14833b';
      } else if (total < 0) {
        textoTotal.style.color = '#d83a3a';
      } else {
        textoTotal.style.color = '#55556b';
      }
    }

    // Cada boton escucha su propio clic y ejecuta su funcion
    botonSumar.addEventListener('click', function () {
      total = total + 100;
      actualizar('Ganaste 100 pesos! Llevas ' + total + ' en total.');
    });

    botonRestar.addEventListener('click', function () {
      total = total - 100;
      actualizar('Perdiste 100 pesos. Llevas ' + total + ' en total.');
    });

    botonReiniciar.addEventListener('click', function () {
      total = 0;
      actualizar('Volviste a empezar desde cero.');
    });
  </script>

</body>
</html>
